name: tag
run-name: Creating Tag
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["sdk"]
    types: [completed]

jobs:
  create-tag:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    environment: Main

    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install .[dev]

      - name: Set current version value
        run: |
          cartesapp_version=$(python -c "from importlib.metadata import version;print(version('cartesapp'))")
          echo Setting Version Var: $cartesapp_version
          echo "cartesapp_version=$cartesapp_version" >> "$GITHUB_ENV"

      - name: Create tag
        uses: actions/github-script@v9
        with:
          script: |
            const tag = 'v${{ env.cartesapp_version }}';
            const ref = `refs/tags/${tag}`;
            const sha = '${{ github.event.workflow_run.head_sha || github.sha }}';

            // Creating an existing ref 422s with an unhandled stack trace, so resolve
            // the current state first and report it in plain language.
            let existing = null;
            try {
              const { data } = await github.rest.git.getRef({
                ...context.repo,
                ref: `tags/${tag}`,
              });
              existing = data.object.sha;
            } catch (err) {
              if (err.status !== 404) throw err;
            }

            if (existing === sha) {
              core.info(`Tag ${tag} already points at ${sha}; nothing to do.`);
              return;
            }
            if (existing) {
              core.setFailed(
                `Tag ${tag} already exists at ${existing}, but this run is at ${sha}. ` +
                `Bump the version in pyproject.toml, or delete the tag to move it.`
              );
              return;
            }

            await github.rest.git.createRef({ ...context.repo, ref, sha });
            core.info(`Created ${ref} at ${sha}`);
